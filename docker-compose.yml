version: '3.8'

services:
  superu:
    build: .
    container_name: superu
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - PORT=8000
    labels:
      - "gethomepage.name=Super U"
      - "gethomepage.description=Tickets de caisse & suivi des prix"
      - "gethomepage.group=Finances"
      - "gethomepage.icon=http://192.168.50.174:8080/superu-logo.svg"
      - "gethomepage.href=http://192.168.50.174:8080"
      - "gethomepage.ping=http://superu:8000"
