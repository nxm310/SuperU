<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="suBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3870"/>
      <stop offset="100%" stop-color="#061c3b"/>
    </linearGradient>
    <linearGradient id="suRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="100%" stop-color="#c90016"/>
    </linearGradient>
    <filter id="suShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Squircle Card -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#suBg)" filter="url(#suShadow)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Super U Red Circle Badge -->
  <circle cx="64" cy="54" r="34" fill="url(#suRed)" filter="url(#suShadow)"/>

  <!-- Super U Bold White "U" -->
  <path d="M50 38 h10 v20 c0 4.5 2 6.5 4 6.5 s4-2 4-6.5 V38 h10 v20 c0 11-5.5 16-14 16 s-14-5-14-16 Z" fill="#ffffff"/>

  <!-- Small Shopping Receipt / Cart Tab -->
  <rect x="26" y="94" width="76" height="20" rx="10" fill="#dc2626" filter="url(#suShadow)"/>
  <text x="64" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">SUPER U</text>
</svg>
